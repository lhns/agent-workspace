name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Main runs finish, so every main commit's images get published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The base image is built and published once; every harness image is built on that exact image
  # (see the image job), so all of them share its layers. A published base is never rebuilt:
  # published harness images depend on its exact layers.
  base:
    name: Build, publish (base)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Forks publish to and test their own registry.
      - name: Image prefix and base tag
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "AGENTS_IMAGE_PREFIX=ghcr.io/${OWNER,,}/agent-workspace" >> "$GITHUB_ENV"
          echo "BASE_HASH=$(sha256sum agents/base/Dockerfile | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # Logged in for the existence check too, so a private package can't look missing and get rebuilt.
      - name: Check for a published base (main)
        if: github.ref == 'refs/heads/main'
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          if docker manifest inspect "$AGENTS_IMAGE_PREFIX-base:$BASE_HASH" > /dev/null 2>&1; then
            echo "$AGENTS_IMAGE_PREFIX-base:$BASE_HASH already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # compose needs a .env that differs from the example, like the launcher does.
      - name: Create .env
        if: steps.published.outputs.exists != 'true'
        run: |
          cp .env.example .env
          echo "# ci" >> .env

      - name: Build base image
        if: steps.published.outputs.exists != 'true'
        run: docker compose build base

      - name: Publish base image to ghcr.io
        if: github.ref == 'refs/heads/main' && steps.published.outputs.exists != 'true'
        run: |
          docker tag agent-workspace-base "$AGENTS_IMAGE_PREFIX-base:$BASE_HASH"
          docker push "$AGENTS_IMAGE_PREFIX-base:$BASE_HASH"

      - name: Log out of ghcr.io
        if: always() && github.ref == 'refs/heads/main'
        run: docker logout ghcr.io

  # Runs the real Linux launcher per harness (core in the base image, then the harness): it builds the image, then the agent must start.
  # On main the tested image is published to ghcr.io and the launcher's pull path is checked.
  image:
    name: Build, test, publish (${{ matrix.harness }})
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, opencode, pi, cline, hermes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Forks publish to and test their own registry. Harmless while AGENTS_LOCAL_BUILD is set.
      - name: Image prefix
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "AGENTS_IMAGE_PREFIX=ghcr.io/${OWNER,,}/agent-workspace" >> "$GITHUB_ENV"

      - name: Free disk space (hermes image is ~3 GB)
        if: matrix.harness == 'hermes'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      # The launcher refuses an unedited .env.
      - name: Create .env
        run: |
          cp .env.example .env
          echo "# ci" >> .env

      # The base job published it. With it current, the launcher skips base and builds only the harness on top.
      # On PRs nothing is published, so the launcher builds base itself.
      - name: Use the published base (main)
        if: github.ref == 'refs/heads/main'
        run: |
          hash=$(sha256sum agents/base/Dockerfile | cut -d' ' -f1)
          ref="$AGENTS_IMAGE_PREFIX-base:$hash"
          docker pull "$ref"
          docker tag "$ref" agent-workspace-base
          docker rmi "$ref"
          echo "$hash" > agents/base/.build.sha256

      # Runner uid is 1001, the container's is 1000: umask 000 makes the launcher's state dirs writable.
      - name: First launch builds the image and the agent starts
        env:
          AGENTS_LOCAL_BUILD: "1"
        run: |
          umask 000
          set -o pipefail
          ./run-agent.sh --harness ${{ matrix.harness }} --exec bash -c "$(cat tests/smoke.sh)" smoke ${{ matrix.harness }} "$PWD/workspace" 2>&1 | tee first.log
          grep -q "^Building ${{ matrix.harness }} image" first.log
          # Every state dir in the harness's dirs= line must have been created by the launcher.
          sed -n 's/^dirs="\(.*\)"$/\1/p' agents/${{ matrix.harness }}/harness.sh | tr ' ' '\n' |
            while read -r d; do test -d "agents/${{ matrix.harness }}/$d" || exit 1; done

      # The harness image must be built on the base image: the base's layers are the first ones of the harness's.
      - name: Harness image shares the base layers
        run: |
          base=$(docker image inspect --format '{{json .RootFS.Layers}}' agent-workspace-base)
          harness=$(docker image inspect --format '{{json .RootFS.Layers}}' agent-workspace-${{ matrix.harness }})
          jq -e -n --argjson b "$base" --argjson h "$harness" '$h[:($b | length)] == $b' > /dev/null ||
            { echo "base layers are not a prefix of the ${{ matrix.harness }} layers"; exit 1; }

      # start.sh is mounted into every image and tested against stub harnesses, so one image is enough.
      # All harness.sh files are mounted, since the tests cover every harness's session lookup.
      - name: Start script resumes and asks as designed
        if: matrix.harness == 'claude'
        run: |
          umask 000
          docker compose run --rm -T -v "$PWD/agents:/opt/agents:ro" claude bash -c "$(cat tests/start.test.sh)" start-test

      # launch.sh runs from the base image (the compose base service), already built by the launch above;
      # the entrypoint is replaced so the test script runs instead of the launcher.
      - name: Launch core parses, records and chooses as designed
        if: matrix.harness == 'claude'
        run: |
          umask 000
          docker compose run --rm -T --entrypoint bash base -c "$(cat tests/launch.test.sh)" launch-test

      # AGENTS_LOCAL_BUILD stays set so a missing pull can't hide a rebuild: the `^Building` check is meaningful.
      # umask 000: the container (uid 1000) writes into the launch dir the runner (uid 1001) creates.
      - name: Second launch does not rebuild
        env:
          AGENTS_LOCAL_BUILD: "1"
        run: |
          umask 000
          set -o pipefail
          ./run-agent.sh --harness ${{ matrix.harness }} --exec bash -c 'echo launched' 2>&1 | tee second.log
          grep -q '^launched$' second.log
          if grep -q '^Building' second.log; then echo "unexpected rebuild"; exit 1; fi

      # Without a terminal, stdin belongs to the harness, not to the launcher core's container.
      - name: Piped stdin reaches the harness
        if: matrix.harness == 'claude'
        env:
          AGENTS_LOCAL_BUILD: "1"
        run: |
          umask 000
          echo hello | ./run-agent.sh --harness claude --exec cat 2>&1 | tee stdin.log
          grep -q '^hello$' stdin.log

      # Publish only what passed above, and only from main. The tag is the Dockerfile hash, so an existing tag is the same image.
      - name: Publish image to ghcr.io
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          ref="$AGENTS_IMAGE_PREFIX-${{ matrix.harness }}:$(cat agents/${{ matrix.harness }}/.build.sha256)"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "$ref already exists"
          else
            docker tag agent-workspace-${{ matrix.harness }} "$ref"
            docker push "$ref"
          fi

      # Main only, like the publish. Logged out, so a private package fails here as it would for users.
      - name: Launch pulls the published image
        if: github.ref == 'refs/heads/main'
        run: |
          docker logout ghcr.io
          umask 000
          set -o pipefail
          docker rmi agent-workspace-${{ matrix.harness }}
          rm agents/${{ matrix.harness }}/.build.sha256
          ./run-agent.sh --harness ${{ matrix.harness }} --exec bash -c 'echo launched' 2>&1 | tee pull.log
          grep -q '^Pulling ${{ matrix.harness }} image' pull.log
          grep -q '^launched$' pull.log
          if grep -q '^Building' pull.log; then echo "unexpected rebuild"; exit 1; fi

      # What users download is the compressed layers in the pushed manifests, not the local layer ids checked above:
      # the base's layer digests must be the first ones of the harness's. If this fails while the local check passes,
      # the push recompressed the layers. Logged out, so it reads anonymously like a user's pull.
      - name: Published harness shares the published base's layers
        if: github.ref == 'refs/heads/main'
        run: |
          layers() {
            local ref=$1 raw
            raw=$(docker buildx imagetools inspect --raw "$ref")
            # A multi-manifest index: follow its first image.
            if [ "$(jq 'has("manifests")' <<< "$raw")" = true ]; then
              raw=$(docker buildx imagetools inspect --raw "${ref%:*}@$(jq -r '.manifests[0].digest' <<< "$raw")")
            fi
            jq -c '[.layers[].digest]' <<< "$raw"
          }
          base=$(layers "$AGENTS_IMAGE_PREFIX-base:$(cat agents/base/.build.sha256)")
          harness=$(layers "$AGENTS_IMAGE_PREFIX-${{ matrix.harness }}:$(cat agents/${{ matrix.harness }}/.build.sha256)")
          echo "base:    $base"
          echo "harness: $harness"
          jq -e -n --argjson b "$base" --argjson h "$harness" '($b | length) > 0 and $h[:($b | length)] == $b' > /dev/null ||
            { echo "published base layers are not a prefix of the published ${{ matrix.harness }} layers"; exit 1; }

      # The launcher ensures the base image first, on every launch; without a harness argument and without a
      # terminal the core takes the harness the launches above recorded (claude).
      - name: Menu launch pulls the published base image
        if: github.ref == 'refs/heads/main' && matrix.harness == 'claude'
        run: |
          umask 000
          set -o pipefail
          docker rmi agent-workspace-base
          rm -f agents/base/.build.sha256
          ./run-agent.sh --exec bash -c 'echo launched' < /dev/null 2>&1 | tee base-pull.log
          grep -q '^Pulling base image' base-pull.log
          grep -q '^launched$' base-pull.log
          if grep -q '^Building' base-pull.log; then echo "unexpected rebuild"; exit 1; fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      # run.sh (the host side) against a stub docker; no engine needed.
      - name: run.sh tests
        run: bash tests/run-sh.test.sh
      # install.sh and uninstall.sh in a temp HOME; the prompt is driven through script(1).
      - name: install.sh tests
        run: bash tests/install.test.sh

  # run.bat against a stub docker: build/skip/rebuild logic without a Windows docker engine.
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: run.bat tests
        shell: powershell
        run: ./tests/run-bat.test.ps1
      # On the runner's own user PATH and HKCU (a throwaway machine); it cleans up through uninstall.bat.
      - name: install.bat tests
        shell: powershell
        run: ./tests/install.test.ps1 -Real
