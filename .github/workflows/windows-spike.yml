name: windows-spike

# Temporary: go/no-go experiments for Windows containers. Deleted after the results are read.
on:
  push:
    branches: [windows-spike]
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings in the checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: wait for the docker daemon
        shell: pwsh
        run: |
          Get-Service docker | Format-List Name,Status,StartType
          if ((Get-Service docker).Status -ne 'Running') { Start-Service docker }
          for ($i = 0; $i -lt 30; $i++) { docker info *> $null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 5 }
          docker version
      - name: pull
        continue-on-error: true
        run: bash spike/exp.sh pull
      - name: build base
        run: bash spike/exp.sh build-base
      - name: build harnesses
        run: bash spike/exp.sh build-harnesses
      - name: round 3 - shells, sqlite, winpty
        continue-on-error: true
        run: bash spike/exp3.sh shells
      - name: round 3 - harnesses under a pseudo-console
        continue-on-error: true
        run: bash spike/exp3.sh tty
