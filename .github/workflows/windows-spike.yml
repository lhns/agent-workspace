name: windows-spike

# Temporary: go/no-go experiments for Windows containers. Deleted after the results are read.
on:
  push:
    branches: [windows-spike]
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings in the checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: info (Q8 pre-cache, Q11)
        continue-on-error: true
        run: bash spike/exp.sh info
      - name: pull (Q8)
        continue-on-error: true
        run: bash spike/exp.sh pull
      - name: build base
        run: bash spike/exp.sh build-base
      - name: build harnesses
        continue-on-error: true
        run: bash spike/exp.sh build-harnesses
      - name: ident (Q12)
        continue-on-error: true
        run: bash spike/exp.sh ident
      - name: mounts (Q1-3)
        continue-on-error: true
        run: bash spike/exp.sh mounts
      - name: volumes (Q3)
        continue-on-error: true
        run: bash spike/exp.sh volumes
      - name: hostname (Q4)
        continue-on-error: true
        run: bash spike/exp.sh hostname
      - name: compose (Q1, Q7, Q10)
        continue-on-error: true
        run: bash spike/exp.sh compose
      - name: stop (Q10)
        continue-on-error: true
        run: bash spike/exp.sh stop
      - name: harness (Q5, Q9)
        continue-on-error: true
        run: bash spike/exp.sh harness
      - name: repo tests (Q6)
        continue-on-error: true
        run: bash spike/exp.sh tests
