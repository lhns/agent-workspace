name: Renovate

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be tested in `if:` directly.
      HAS_TOKEN: ${{ secrets.RENOVATE_TOKEN != '' }}
    steps:
      - name: Check for RENOVATE_TOKEN
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::notice::RENOVATE_TOKEN is not set, skipping. Create a PAT and add it as a repository secret (PRs made with GITHUB_TOKEN do not trigger CI)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        if: env.HAS_TOKEN == 'true'
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
