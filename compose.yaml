name: agent-workspace

# One file for Linux and Windows containers: the launchers export the Windows values (ADR 26).
# Defaults are the Linux ones, so a plain `docker compose` on Linux needs none of them.
#   AGENTS_IMAGE_SUFFIX  "-windows" for the Windows images, so both can live on one machine
#   AGENTS_DOCKERFILE    Dockerfile or Dockerfile.windows
#   AGENTS_ISOLATION     process or hyperv for Windows containers; default = the daemon's choice
#   AGENTS_HOME          the agent user's home (HOME, mount targets)
#   AGENTS_DIR           agent-workspace's own files: agents/ (scripts), launch/ (this run's hand-off),
#                        instructions/ (your AGENTS.md); the base service has shared/ instead of the last two
# In-container paths are never hardcoded in the scripts: under Git Bash on Windows an absolute
# /opt/... would resolve into Git's folder.
# All mounts are directories in the long syntax: single files can't be mounted on Windows
# containers, and the long syntax has no trouble with drive letters in targets.

# Mounts every harness shares; compose can't merge lists, so each service repeats these.
x-workspace: &workspace
  type: bind
  source: ${WORKSPACE_DIR:-./workspace}
  # The launchers set this to the host path, so tools that key sessions by directory keep
  # them per host folder. Plain `docker compose run` keeps /workspace.
  target: ${AGENTS_WORKSPACE_TARGET:-/workspace}
  # Passed through for remote Docker setups with caching mounts; empty = Docker's default.
  consistency: ${AGENTS_WORKSPACE_CONSISTENCY:-}
  # The launchers create ./workspace and refuse a missing WORKSPACE_DIR; never create it here.
  bind:
    create_host_path: false

# Git rewrites its config via lockfile + rename, which a single-file mount would break.
x-git: &git
  type: bind
  source: ./shared/git
  target: ${AGENTS_HOME:-/home/agent}/.config/git

# Mounted, not built in: script edits need no rebuild. start.sh, menu.sh, docker.sh, os.sh,
# environment.md and each harness's harness.sh are in it; every service's command runs start.sh.
x-agents: &agents
  type: bind
  source: ./agents
  target: ${AGENTS_DIR:-/opt/agent-workspace}/agents
  read_only: true
# Your instructions, appended to the generated ones at start (agents/start.sh, ADR 25).
x-instructions: &instructions
  type: bind
  source: ./shared/instructions
  target: ${AGENTS_DIR:-/opt/agent-workspace}/instructions
  read_only: true
# Disposable caches and downloaded tools on the daemon: cheap on a remote Docker, kept across runs (ADR 25).
x-cache: &cache
  type: volume
  source: cache
  target: ${AGENTS_HOME:-/home/agent}/.cache
# The seed key for Docker (agents/docker.sh): enrolled once, shared by every harness. The launchers create it.
x-remote-docker: &remote-docker
  type: bind
  source: ./shared/remote-docker
  target: ${AGENTS_HOME:-/home/agent}/.remote-docker
# What agents/launch.sh decided for this run (args, resume mode).
x-launch: &launch
  type: bind
  source: ./shared/.launch
  target: ${AGENTS_DIR:-/opt/agent-workspace}/launch
  read_only: true
  # The launchers create it; never as root via a plain `docker compose run`. So a plain
  # `docker compose run <harness>` needs one launcher run first (README, Settings).
  bind:
    create_host_path: false

# Proxy settings from the shell that starts the launcher, else from .env, for builds and agents.
# Either spelling sets both: apt, curl and git read lowercase, most others uppercase.
x-proxy: &proxy
  HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
  HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
  NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
  http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
  https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
  no_proxy: ${no_proxy:-${NO_PROXY:-}}

x-harness: &harness
  # Names this container's Docker key in `remote-docker remote key ls` (the key comment has the hostname).
  hostname: aw-${AGENTS_RUN_ID:-run}
  isolation: ${AGENTS_ISOLATION:-default}
  stdin_open: true
  tty: true
  working_dir: ${AGENTS_WORKSPACE_TARGET:-/workspace}
  env_file: .env
  environment:
    # Git Bash has no HOME unless it is given one (it would be /, Git's own folder).
    HOME: ${AGENTS_HOME:-/home/agent}
    AGENTS_DIR: ${AGENTS_DIR:-/opt/agent-workspace}
    AGENTS_HOME: ${AGENTS_HOME:-/home/agent}
    AGENTS_PLATFORM: ${AGENTS_PLATFORM:-}
    # Shell value wins over .env; read by agents/start.sh.
    AGENTS_AUTORESUME: ${AGENTS_AUTORESUME:-}
    AGENTS_NONINTERACTIVE: ${AGENTS_NONINTERACTIVE:-}
    # Which shared/.launch/<id> to read; set by the launchers.
    AGENTS_RUN_ID: ${AGENTS_RUN_ID:-}
    # Docker for the agent (agents/docker.sh); shell value wins over .env.
    AGENTS_DOCKER: ${AGENTS_DOCKER:-}
    AGENTS_DOCKER_TOKEN: ${AGENTS_DOCKER_TOKEN:-}
    <<: *proxy
    # Node's built-in fetch ignores the proxy variables unless this is set.
    NODE_USE_ENV_PROXY: "1"

# build.dockerfile and image names differ per platform; the harness images build FROM the base one.
services:
  # Harness images build FROM this one, so the run scripts build it first. Every launch starts it
  # first: agents/launch.sh is the launcher's OS-independent half (options, harness menu,
  # shared/.last-harness) and hands its result to the host launcher in shared/.launch/<id>.
  base:
    build:
      context: ./agents/base
      dockerfile: ${AGENTS_DOCKERFILE:-Dockerfile}
      isolation: ${AGENTS_ISOLATION:-default}
      args: *proxy
    image: agent-workspace-base${AGENTS_IMAGE_SUFFIX:-}
    isolation: ${AGENTS_ISOLATION:-default}
    stdin_open: true
    tty: true
    entrypoint: [bash, "${AGENTS_DIR:-/opt/agent-workspace}/agents/launch.sh"]
    environment:
      HOME: ${AGENTS_HOME:-/home/agent}
      AGENTS_DIR: ${AGENTS_DIR:-/opt/agent-workspace}
      AGENTS_HOME: ${AGENTS_HOME:-/home/agent}
      AGENTS_PLATFORM: ${AGENTS_PLATFORM:-}
      AGENTS_WORKSPACE_TARGET: ${AGENTS_WORKSPACE_TARGET:-/workspace}
      # Shell value wins over .env, like for the harnesses.
      AGENTS_HARNESS: ${AGENTS_HARNESS:-}
      AGENTS_NONINTERACTIVE: ${AGENTS_NONINTERACTIVE:-}
      AGENTS_RUN_ID: ${AGENTS_RUN_ID:-}
    volumes:
      - *agents
      - type: bind
        source: ./shared
        target: ${AGENTS_DIR:-/opt/agent-workspace}/shared

  claude:
    <<: *harness
    command: [bash, "${AGENTS_DIR:-/opt/agent-workspace}/agents/start.sh", claude]
    build:
      context: ./agents/claude
      dockerfile: ${AGENTS_DOCKERFILE:-Dockerfile}
      isolation: ${AGENTS_ISOLATION:-default}
      args: *proxy
    image: agent-workspace-claude${AGENTS_IMAGE_SUFFIX:-}
    volumes:
      - *workspace
      - *git
      - type: bind
        source: ./agents/claude/config
        target: ${AGENTS_HOME:-/home/agent}/.claude
      - *instructions
      - *agents
      - *cache
      - *remote-docker
      - *launch

  opencode:
    <<: *harness
    command: [bash, "${AGENTS_DIR:-/opt/agent-workspace}/agents/start.sh", opencode]
    build:
      context: ./agents/opencode
      dockerfile: ${AGENTS_DOCKERFILE:-Dockerfile}
      isolation: ${AGENTS_ISOLATION:-default}
      args: *proxy
    image: agent-workspace-opencode${AGENTS_IMAGE_SUFFIX:-}
    volumes:
      - *workspace
      - *git
      - type: bind
        source: ./agents/opencode/config
        target: ${AGENTS_HOME:-/home/agent}/.config/opencode
      - type: bind
        source: ./agents/opencode/data
        target: ${AGENTS_HOME:-/home/agent}/.local/share/opencode
      - *instructions
      - *agents
      - *cache
      - *remote-docker
      - *launch

  pi:
    <<: *harness
    command: [bash, "${AGENTS_DIR:-/opt/agent-workspace}/agents/start.sh", pi]
    build:
      context: ./agents/pi
      dockerfile: ${AGENTS_DOCKERFILE:-Dockerfile}
      isolation: ${AGENTS_ISOLATION:-default}
      args: *proxy
    image: agent-workspace-pi${AGENTS_IMAGE_SUFFIX:-}
    volumes:
      - *workspace
      - *git
      - type: bind
        source: ./agents/pi/config
        target: ${AGENTS_HOME:-/home/agent}/.pi/agent
      - *instructions
      - *agents
      - *cache
      - *remote-docker
      - *launch

  cline:
    <<: *harness
    command: [bash, "${AGENTS_DIR:-/opt/agent-workspace}/agents/start.sh", cline]
    build:
      context: ./agents/cline
      dockerfile: ${AGENTS_DOCKERFILE:-Dockerfile}
      isolation: ${AGENTS_ISOLATION:-default}
      args: *proxy
    image: agent-workspace-cline${AGENTS_IMAGE_SUFFIX:-}
    volumes:
      - *workspace
      - *git
      - type: bind
        source: ./agents/cline/config
        target: ${AGENTS_HOME:-/home/agent}/.cline
      - *instructions
      - *agents
      - *cache
      - *remote-docker
      - *launch

  # Linux only: there is no Dockerfile.windows, and the launchers never start it there.
  hermes:
    <<: *harness
    command: [bash, "${AGENTS_DIR:-/opt/agent-workspace}/agents/start.sh", hermes]
    build:
      context: ./agents/hermes
      dockerfile: ${AGENTS_DOCKERFILE:-Dockerfile}
      isolation: ${AGENTS_ISOLATION:-default}
      args: *proxy
    image: agent-workspace-hermes${AGENTS_IMAGE_SUFFIX:-}
    # Hermes refuses a bind-mounted home, so this copies its state from and back to the
    # config folder around each run. Mounted, not built in: script edits need no rebuild.
    entrypoint: [bash, "${AGENTS_DIR:-/opt/agent-workspace}/agents/hermes/entrypoint.sh"]
    volumes:
      - *workspace
      - *git
      - type: bind
        source: ./agents/hermes/config
        target: ${AGENTS_HOME:-/home/agent}/.hermes-config
      - *instructions
      - *agents
      - *cache
      - *remote-docker
      - *launch

volumes:
  cache: {}
