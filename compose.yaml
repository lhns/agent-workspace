name: agent-workspace

# Mounts every harness shares; compose can't merge lists, so each service repeats these.
x-workspace: &workspace
  type: bind
  source: ${WORKSPACE_DIR:-./workspace}
  # The launchers set this to the host path, so tools that key sessions by directory keep
  # them per host folder. Plain `docker compose run` keeps /workspace.
  target: ${AGENTS_WORKSPACE_TARGET:-/workspace}
  # Passed through for remote Docker setups with caching mounts; empty = Docker's default.
  consistency: ${AGENTS_WORKSPACE_CONSISTENCY:-}
  # The launchers create ./workspace and refuse a missing WORKSPACE_DIR; never create it here.
  bind:
    create_host_path: false

# Directory mount: git rewrites config via lockfile + rename, which a single-file mount breaks.
x-git: &git ./shared/git:/home/agent/.config/git

# Mounted, not built in: script edits need no rebuild. Each service's command runs it.
x-start: &start ./agents/start.sh:/usr/local/lib/agents-start.sh:ro
# Written into each harness's global instructions at start (agents/start.sh): these notes, then the user's file.
x-environment: &environment ./agents/environment.md:/usr/local/lib/agents-environment.md:ro
x-user-instructions: &user-instructions ./shared/AGENTS.md:/opt/agents-user.md:ro
# Disposable caches and downloaded tools on the daemon: cheap on a remote Docker, kept across runs (ADR 25).
x-cache: &cache cache:/home/agent/.cache
x-menu: &menu ./agents/menu.sh:/usr/local/lib/agents-menu.sh:ro
x-docker: &docker ./agents/docker.sh:/usr/local/lib/agents-docker.sh:ro
# The seed key for Docker (agents/docker.sh): enrolled once, shared by every harness. The launchers create it.
x-remote-docker: &remote-docker ./shared/remote-docker:/home/agent/.remote-docker
# What agents/launch.sh decided for this run (args, resume mode); each service also mounts its
# own agents/<harness>/harness.sh (session lookup, picker) at /usr/local/lib/agents-harness.sh.
x-launch: &launch
  type: bind
  source: ./shared/.launch
  target: /opt/launch
  read_only: true
  # The launchers create it; never as root via a plain `docker compose run`. So a plain
  # `docker compose run <harness>` needs one launcher run first (README, Settings).
  bind:
    create_host_path: false

# Proxy settings from the shell that starts the launcher, else from .env, for builds and agents.
# Either spelling sets both: apt, curl and git read lowercase, most others uppercase.
x-proxy: &proxy
  HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
  HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
  NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
  http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
  https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
  no_proxy: ${no_proxy:-${NO_PROXY:-}}

x-harness: &harness
  # Names this container's Docker key in `remote-docker remote key ls` (the key comment has the hostname).
  hostname: aw-${AGENTS_RUN_ID:-run}
  stdin_open: true
  tty: true
  working_dir: ${AGENTS_WORKSPACE_TARGET:-/workspace}
  env_file: .env
  environment:
    # Shell value wins over .env; read by agents/start.sh.
    AGENTS_AUTORESUME: ${AGENTS_AUTORESUME:-}
    AGENTS_NONINTERACTIVE: ${AGENTS_NONINTERACTIVE:-}
    # Which shared/.launch/<id> to read; set by the launchers.
    AGENTS_RUN_ID: ${AGENTS_RUN_ID:-}
    # Docker for the agent (agents/docker.sh); shell value wins over .env.
    AGENTS_DOCKER: ${AGENTS_DOCKER:-}
    AGENTS_DOCKER_TOKEN: ${AGENTS_DOCKER_TOKEN:-}
    <<: *proxy
    # Node's built-in fetch ignores the proxy variables unless this is set.
    NODE_USE_ENV_PROXY: "1"

services:
  # Harness images build FROM this one, so the run scripts build it first. Every launch starts it
  # first: agents/launch.sh is the launcher's OS-independent half (options, harness menu,
  # shared/.last-harness) and hands its result to the host launcher in shared/.launch/<id>.
  base:
    build: { context: ./agents/base, args: *proxy }
    image: agent-workspace-base
    stdin_open: true
    tty: true
    entrypoint: [bash, /opt/agents/launch.sh]
    environment:
      AGENTS_WORKSPACE_TARGET: ${AGENTS_WORKSPACE_TARGET:-/workspace}
      # Shell value wins over .env, like for the harnesses.
      AGENTS_HARNESS: ${AGENTS_HARNESS:-}
      AGENTS_NONINTERACTIVE: ${AGENTS_NONINTERACTIVE:-}
      AGENTS_RUN_ID: ${AGENTS_RUN_ID:-}
    volumes:
      - ./agents:/opt/agents:ro
      - ./shared:/opt/shared

  claude:
    <<: *harness
    command: [bash, /usr/local/lib/agents-start.sh, claude]
    build: { context: ./agents/claude, args: *proxy }
    volumes:
      - *workspace
      - *git
      - ./agents/claude/config:/home/agent/.claude
      - *user-instructions
      - *cache
      - *start
      - *environment
      - *menu
      - *docker
      - *remote-docker
      - *launch
      - ./agents/claude/harness.sh:/usr/local/lib/agents-harness.sh:ro

  opencode:
    <<: *harness
    command: [bash, /usr/local/lib/agents-start.sh, opencode]
    build: { context: ./agents/opencode, args: *proxy }
    volumes:
      - *workspace
      - *git
      - ./agents/opencode/config:/home/agent/.config/opencode
      - ./agents/opencode/data:/home/agent/.local/share/opencode
      - *user-instructions
      - *cache
      - *start
      - *environment
      - *menu
      - *docker
      - *remote-docker
      - *launch
      - ./agents/opencode/harness.sh:/usr/local/lib/agents-harness.sh:ro

  pi:
    <<: *harness
    command: [bash, /usr/local/lib/agents-start.sh, pi]
    build: { context: ./agents/pi, args: *proxy }
    volumes:
      - *workspace
      - *git
      - ./agents/pi/config:/home/agent/.pi/agent
      - *user-instructions
      - *cache
      - *start
      - *environment
      - *menu
      - *docker
      - *remote-docker
      - *launch
      - ./agents/pi/harness.sh:/usr/local/lib/agents-harness.sh:ro

  cline:
    <<: *harness
    command: [bash, /usr/local/lib/agents-start.sh, cline]
    build: { context: ./agents/cline, args: *proxy }
    volumes:
      - *workspace
      - *git
      - ./agents/cline/config:/home/agent/.cline
      - *user-instructions
      - *cache
      - *start
      - *environment
      - *menu
      - *docker
      - *remote-docker
      - *launch
      - ./agents/cline/harness.sh:/usr/local/lib/agents-harness.sh:ro

  hermes:
    <<: *harness
    command: [bash, /usr/local/lib/agents-start.sh, hermes]
    build: { context: ./agents/hermes, args: *proxy }
    # Hermes refuses a bind-mounted home, so this copies its state from and back to the
    # config folder around each run. Mounted, not built in: script edits need no rebuild.
    entrypoint: [bash, /usr/local/lib/hermes-entrypoint.sh]
    volumes:
      - *workspace
      - *git
      - ./agents/hermes/config:/home/agent/.hermes-config
      - ./agents/hermes/entrypoint.sh:/usr/local/lib/hermes-entrypoint.sh:ro
      - *user-instructions
      - *cache
      - *start
      - *environment
      - *menu
      - *docker
      - *remote-docker
      - *launch
      - ./agents/hermes/harness.sh:/usr/local/lib/agents-harness.sh:ro

volumes:
  cache: {}
